name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cicache
          POSTGRES_PASSWORD: cicache-ci-password
          POSTGRES_DB: cicache
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cicache"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://cicache:cicache-ci-password@localhost:5432/cicache?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install admin UI deps
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Lint admin UI
        working-directory: web
        run: bun run lint

      - name: Test admin UI
        working-directory: web
        run: bun run test:coverage

      - name: Build admin UI
        working-directory: web
        run: bun run build

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # -p 1: several packages share the Postgres service above and
        # TRUNCATE their tables at the start of each test; running package
        # binaries in parallel races them against each other.
        run: go test ./... -race -p 1 -coverprofile=coverage.out

      - name: Enforce coverage floor
        # Go has no built-in coverage threshold (unlike vitest's
        # coverage.thresholds for web), so check it by hand. The floor sits
        # a few points under the number this suite actually hits — enough
        # to fail on a real regression without being tripped by normal
        # coverage-profile rounding.
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 80.0) }' || {
            echo "Coverage ${total}% is below the 80% floor"
            exit 1
          }

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  docker-build-check:
    runs-on: ubuntu-latest
    # Validates the image still builds on every PR; publishing happens
    # separately in docker-publish.yml only for trusted refs (main/tags).
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
